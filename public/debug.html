<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Firestore Debug — Full Scan</title>
<style>body{font-family:sans-serif;padding:20px;background:#111;color:#eee}input,button{font-size:14px;padding:8px;margin:4px}pre{background:#1a1a1a;padding:12px;border-radius:6px;overflow:auto;white-space:pre-wrap}</style></head>
<body>
<div id="login">
  <h3>Firestore Debug — Full Collection Scan</h3>
  <input id="email" placeholder="Email" /><br/>
  <input id="pass" type="password" placeholder="Contraseña" /><br/>
  <button onclick="doLogin()">Login</button>
  <p id="err" style="color:red"></p>
</div>
<pre id="out" style="display:none">Cargando...</pre>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcY4fRbtUVrQyM2Y_IywgPmQLPV_j79-o",
  authDomain: "g-m-parts-lac7fg.firebaseapp.com",
  projectId: "g-m-parts-lac7fg",
  storageBucket: "g-m-parts-lac7fg.appspot.com",
  messagingSenderId: "192029790072",
  appId: "1:192029790072:web:09dd0119229174fcc6428d",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ALL possible collection names from:
//  - src/ codebase (useFirestoreCollection, collection(db, ...))
//  - firestoreDb.js (mapDocKeyToCollection, CATALOG_MAP)
//  - firestoreStock.js (direct writes)
//  - reference/ original (entity names)
//  - Flutter/Dart naming variants
const ALL_COLS = [
  // Del admin actual (src/)
  "Facturas", "FacturasVentasCompras", "cuentasPorCobrar",
  "Articles", "Kardex_element", "Almacen_movement", "Almacen", "Vehiculos",
  "Articles_Warehouse", "LastCode", "users", "Proveedores", "service", "recepciones",
  // Catálogos (firestoreDb.js CATALOG_MAP)
  "article_brand_marca", "Group", "subgroup", "measurement_unit",
  "vehicle_marca_brand", "vehicle_model_modelo", "encargados",
  // Posibles variantes Flutter/Dart (camelCase + PascalCase)
  "Clientes", "clientes", "Personal", "personal",
  "Articulos", "articulos",
  "Kardex", "kardex", "Movimientos", "movimientos",
  "Almacenes", "almacenes",
  "Servicios", "servicios",
  "Recepciones", "Recepcion", "recepcion",
  "OrdenesTrabajo", "ordenes_trabajo", "OrdenTrabajo", "orden_trabajo",
  "Diagnosticos", "diagnosticos",
  "Cotizaciones", "cotizaciones", "Cotizacion", "cotizacion",
  "Factura", "Boleta", "Guia", "NotaCredito", "NotaPedido", "OrdenPago",
  "facturas", "boletas", "guias", "notas_credito",
  "Ventas", "ventas", "Compras", "compras",
  "Productos", "productos", "Stock", "stock",
  "CuentasCobrar", "cuentas_cobrar", "CuentasPagar", "cuentas_pagar",
  "Vales", "vales", "ValeInsumos", "vale_insumos",
  "Marcas", "marcas", "Unidades", "unidades", "Grupos", "grupos",
  "Settings", "Config", "config",
  "Reportes", "reportes",
];

async function doLogin() {
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
    document.getElementById("login").style.display = "none";
    document.getElementById("out").style.display = "block";
    await run();
  } catch (e) {
    document.getElementById("err").textContent = e.message;
  }
}

async function run() {
  let html = "";

  for (const name of ALL_COLS) {
    try {
      const snap = await db.collection(name).get();
      if (snap.size === 0) continue;

      const tfCount = {};   // tipofactura -> count
      const toCount = {};   // TipoOperacion -> count
      const combos = {};    // tipofactura+TipoOperacion -> count
      let sample = null;

      snap.forEach(d => {
        const data = d.data();
        if (!sample) sample = { id: d.id, ...data };

        const tf = data.tipofactura;
        if (tf) {
          tfCount[tf] = (tfCount[tf] || 0) + 1;
          const to = data.TipoOperacion;
          const key = tf + " | " + (to || "(sin TipoOperacion)");
          combos[key] = (combos[key] || 0) + 1;
        } else {
          tfCount["(sin tipofactura)"] = (tfCount["(sin tipofactura)"] || 0) + 1;
        }

        const to = data.TipoOperacion;
        if (to) toCount[to] = (toCount[to] || 0) + 1;
      });

      html += `\n===== ${name} (${snap.size} docs) =====\n`;

      // tipofactura distribution
      const tfEntries = Object.entries(tfCount).sort((a,b) => b[1] - a[1]);
      html += `  tipofactura: ${tfEntries.map(([k,v]) => `${k}=${v}`).join(", ")}\n`;

      // combos tipofactura + TipoOperacion
      if (Object.keys(combos).length > 0) {
        html += `  combos (tf+to): ${Object.entries(combos).sort((a,b) => b[1]-a[1]).map(([k,v]) => `${k}=${v}`).join(" | ")}\n`;
      }

      // Sample fields (resumido)
      const fields = Object.keys(sample).filter(k => k !== "id");
      html += `  campos: ${fields.slice(0, 12).join(", ")}${fields.length > 12 ? `...(+${fields.length - 12})` : ""}\n`;
    } catch (e) {
      // skip collections that don't exist
    }
  }

  html += "\n\n=== FIN ===";
  document.getElementById("out").textContent = html;
}
</script>
</body>
</html>
