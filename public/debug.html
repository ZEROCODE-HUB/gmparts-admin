<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Firestore Debug — Muestra por TipoOperacion</title>
<style>body{font-family:sans-serif;padding:20px;background:#111;color:#eee}input,button{font-size:14px;padding:8px;margin:4px}pre{background:#1a1a1a;padding:12px;border-radius:6px;overflow:auto;white-space:pre-wrap}</style></head>
<body>
<div id="login">
  <h3>Firestore Debug — Muestra compra vs venta</h3>
  <input id="email" placeholder="Email" /><br/>
  <input id="pass" type="password" placeholder="Contraseña" /><br/>
  <button onclick="doLogin()">Login</button>
  <p id="err" style="color:red"></p>
</div>
<pre id="out" style="display:none">Cargando...</pre>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcY4fRbtUVrQyM2Y_IywgPmQLPV_j79-o",
  authDomain: "g-m-parts-lac7fg.firebaseapp.com",
  projectId: "g-m-parts-lac7fg",
  storageBucket: "g-m-parts-lac7fg.appspot.com",
  messagingSenderId: "192029790072",
  appId: "1:192029790072:web:09dd0119229174fcc6428d",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

async function doLogin() {
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
    document.getElementById("login").style.display = "none";
    document.getElementById("out").style.display = "block";
    await run();
  } catch (e) {
    document.getElementById("err").textContent = e.message;
  }
}

async function run() {
  let html = "";

  // Muestras de FacturasVentasCompras separadas por TipoOperacion
  const col = "FacturasVentasCompras";
  
  html += "===== FacturasVentasCompras — MUESTRA VENTA (TipoOperacion == venta) =====\n";
  try {
    const ventaSnap = await db.collection(col).where("TipoOperacion", "==", "venta").limit(1).get();
    if (!ventaSnap.empty) {
      const d = ventaSnap.docs[0];
      html += JSON.stringify({ id: d.id, ...d.data() }, null, 2) + "\n\n";
    } else { html += "(sin docs de venta)\n\n"; }
  } catch(e) { html += "ERROR: " + e.message + "\n\n"; }

  html += "===== FacturasVentasCompras — MUESTRA COMPRA (TipoOperacion == compra) =====\n";
  try {
    const compraSnap = await db.collection(col).where("TipoOperacion", "==", "compra").limit(1).get();
    if (!compraSnap.empty) {
      const d = compraSnap.docs[0];
      html += JSON.stringify({ id: d.id, ...d.data() }, null, 2) + "\n\n";
    } else { html += "(sin docs de compra)\n\n"; }
  } catch(e) { html += "ERROR: " + e.message + "\n\n"; }

  html += "===== FacturasVentasCompras — Boleta con venta =====";
  try {
    const bolSnap = await db.collection(col).where("tipofactura", "==", "Boleta").limit(1).get();
    if (!bolSnap.empty) {
      const d = bolSnap.docs[0];
      html += JSON.stringify({ id: d.id, ...d.data() }, null, 2) + "\n\n";
    } else { html += "(sin boletas)\n\n"; }
  } catch(e) { html += "ERROR: " + e.message + "\n\n"; }

  html += "===== cuentasPorCobrar — cuenta tipo Cobrar =====";
  try {
    const cobSnap = await db.collection("cuentasPorCobrar").where("tipoCuenta", "==", "Cobrar").limit(1).get();
    if (!cobSnap.empty) {
      const d = cobSnap.docs[0];
      html += JSON.stringify({ id: d.id, ...d.data() }, null, 2) + "\n\n";
    } else { html += "(sin cuentas cobrar)\n\n"; }
  } catch(e) { html += "ERROR: " + e.message + "\n\n"; }

  html += "===== cuentasPorCobrar — cuenta tipo Pagar =====";
  try {
    const pagSnap = await db.collection("cuentasPorCobrar").where("tipoCuenta", "==", "Pagar").limit(1).get();
    if (!pagSnap.empty) {
      const d = pagSnap.docs[0];
      html += JSON.stringify({ id: d.id, ...d.data() }, null, 2) + "\n\n";
    } else { html += "(sin cuentas pagar)\n\n"; }
  } catch(e) { html += "ERROR: " + e.message + "\n\n"; }

  html += "=== FIN ===";
  document.getElementById("out").textContent = html;
}
</script>
</body>
</html>
